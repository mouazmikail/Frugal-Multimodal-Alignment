# =============================================================================
# Low-Eval Kit — orchestration des trois environnements d'évaluation
# (tableau 2.3 du manuscrit : référence cloud, référence locale, terrain)
#
# Points corrigés par rapport à la version 1.0 :
#   * plus de doublon ENTRYPOINT/command (l'image n'a plus d'ENTRYPOINT) ;
#   * le service terrain lit les mesures réelles depuis la base SQLite
#     (script run_field_protocol.py corrigé) ;
#   * cible GPU dédiée (low-eval-kit:2.0-gpu) pour les environnements
#     cloud/local ; le terrain reste sur l'image CPU.
#
# Usage :
#   docker compose --profile eval up            # évaluation (GPU si cible gpu)
#   docker compose --profile terrain up         # protocole terrain (NET_ADMIN)
#   docker compose --profile dashboard up       # tableau de bord Streamlit
#   docker compose --profile bench up           # recalcul Bench-Low (CPU pur)
# =============================================================================
services:

  # -- Recalcul Bench-Low (CPU, sans GPU, sans modèle) ------------------------
  # Rejoue tableaux 4.1 / 4.2 et l'analyse de sensibilité depuis le CSV de
  # référence ; c'est le service de vérification la plus légère.
  bench:
    build: .
    image: low-eval-kit:2.0
    command: python scripts/compute_scores.py --exports /app/runs/exports
    volumes:
      - ./runs:/app/runs
    profiles: ["bench"]

  # -- Évaluation standard (cloud A100 ou local RTX 4060) ----------------------
  eval:
    build:
      context: .
      target: gpu            # variante GPU : PyTorch CUDA + Transformers
    image: low-eval-kit:2.0-gpu
    command: >
      python scripts/run_evaluation.py
      --modele $${LOWEVAL_MODEL:-MiniCPM-V-2.8B}
      --environnement $${LOWEVAL_ENV:-local}
      --corpus /app/data/corpus.jsonl
      --up $${LOWEVAL_UP:-0.58}
      --base /app/runs/loweval.db
      --sortie /app/runs
    environment:
      LOWEVAL_ENV: ${LOWEVAL_ENV:-local}
      LOWEVAL_MODEL: ${LOWEVAL_MODEL:-MiniCPM-V-2.8B}
      LOWEVAL_UP: ${LOWEVAL_UP:-0.58}
    volumes:
      - ./data:/app/data
      - ./runs:/app/runs
    profiles: ["eval"]

  # -- Protocole terrain : contraintes CPU/réseau simulées ----------------------
  # Mesures réelles journalisées dans la base ; rapport via --profile bench
  # ou directement : python scripts/run_field_protocol.py --rapporter.
  eval-terrain:
    build: .
    image: low-eval-kit:2.0
    command: >
      python scripts/run_field_protocol.py --preparer
      --interface-reseau eth0
    volumes:
      - ./data:/app/data
      - ./runs:/app/runs
    cap_add: ["NET_ADMIN"]    # requis pour tc netem (simulation 4G)
    profiles: ["terrain"]

  # -- Tableau de bord Streamlit (section 3.2.3) --------------------------------
  dashboard:
    build: .
    image: low-eval-kit:2.0
    command: >
      streamlit run dashboard/app.py
      --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - ./runs:/app/runs
    profiles: ["dashboard"]
